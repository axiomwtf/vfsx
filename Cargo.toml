[package]
name = "vfsx"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tar = "0.4"
zstd = "0.13"
xz2 = "0.1"
flate2 = "1.0"
ed25519-dalek = "2.2"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.5"
xattr = "1.4"
indicatif = "0.17"

blake3 = "1.5"

hex = "0.4"
rand = "0.8"
dirs = "5.0"
whoami = "1.4"
tempfile = "3.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
[features]
fuse = []

[[bin]]
name = "vfsx"
path = "src/main.rs"